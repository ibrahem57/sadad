<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../app.css"><title>دخول سدد</title></head><body class="bg-surface font-body-md text-on-surface" data-screen="login"><main class="min-h-screen flex items-center justify-center px-margin-mobile py-10"><section class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-xl p-space-lg flex flex-col gap-space-md"><div class="flex flex-col items-center text-center gap-space-sm"><img src="../logo-light.jpeg" data-brand-logo alt="شعار سدد" style="width:112px;height:112px;object-fit:contain;border-radius:22px"><span class="font-title-lg text-title-lg text-primary font-bold">سدد</span><h1 class="font-headline-md text-headline-md text-on-surface">تسجيل دخول صاحب المتجر</h1><p class="text-body-sm text-on-surface-variant">يُنشئ الأدمن حسابك ويرسل لك اسم المستخدم وكلمة المرور المؤقتة.</p></div><form id="loginForm" class="flex flex-col gap-space-sm"><label class="font-label-lg text-label-lg">اسم المستخدم<input id="loginUsername" class="w-full h-12 rounded-xl bg-surface-container-low px-space-md text-on-surface" autocomplete="username" required></label><label class="font-label-lg text-label-lg">كلمة المرور<input id="loginPassword" class="w-full h-12 rounded-xl bg-surface-container-low px-space-md text-on-surface" type="password" autocomplete="current-password" required></label><label class="font-label-lg text-label-lg">اسم مستخدم الجهاز<input id="loginStaffName" class="w-full h-12 rounded-xl bg-surface-container-low px-space-md text-on-surface" maxlength="80" placeholder="مطلوب عند استخدام أكثر من جهاز"></label><p id="loginError" class="text-error font-body-sm" role="alert"></p><button id="loginSubmit" class="w-full h-12 rounded-xl bg-primary-container text-on-primary font-title-lg text-title-lg font-bold" type="submit">دخول آمن</button></form><p class="text-center font-body-sm text-on-surface-variant">نسيت بيانات الدخول؟ تواصل مع أدمن المنصة.</p></section></main><script src="../app.js"></script></body></html>
