name: Statement PDF device verification
on:
  pull_request:
    branches: [ticket-56-ci-base]
permissions:
  contents: read
concurrency:
  group: export-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pdf-device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Run native PDF and sharing tests on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.sadad.app.export.PdfWriterTest,com.sadad.app.export.StatementExportDeviceTest --console=plain
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-device-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**