name: Android, admin site and edge-function checks

# On main, app, dashboard, Edge, database, formatting, status page and AGENTS.md changes run checks;
# other docs-only pushes do not. Every pull request runs them.
# Debug builds are checks only; android-release.yml publishes release.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ledger-core/**'
      - 'contract/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'server/public/**'
      - 'tools/check.sh'
      - 'Supabase-Setup/supabase/functions/**'
      - 'Supabase-Setup/supabase/migrations/**'
      - 'Supabase-Setup/scripts/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/admin-pages.yml'
      - 'AGENTS.md'
      - 'docs/CONTINUE_HERE.md'
      - '.editorconfig'
  # Every PR runs, so the required `ci-ok` check always reports (a path-skipped required check
  # stays pending and blocks the merge).
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check docs and code formatting
        run: ./tools/check.sh docs format

  admin-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard JavaScript and build deployment assets
        run: ./tools/check.sh dashboard

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK and sets ANDROID_HOME, so the
      # git-ignored local.properties is not needed here.
      - name: Run Android tests and builds
        run: ./tools/check.sh android

      # This step exists because the first CI run caught a real one: a device set to UTC produced a
      # different createdAt shape ("Z") than a device at +03:00, and only the runner's zone exposed
      # it. Running the suite in a non-UTC zone as well keeps that class of bug visible.
      - name: JVM unit tests under a non-UTC device zone
        run: ./gradlew :ledger-core:test testDebugUnitTest --rerun-tasks --console=plain
        env:
          TZ: Asia/Gaza

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test each edge function
        run: ./tools/check.sh edge

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test migration and RPC contracts in isolated databases
        run: ./tools/check.sh database

  # The one required status check for merging into main (repository ruleset).
  ci-ok:
    if: always()
    needs: [docs-and-format, admin-site, android, edge-functions, database]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every check job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all check jobs succeeded"
