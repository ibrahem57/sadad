<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../app.css"><title>تغيير كلمة المرور</title></head><body class="bg-surface font-body-md text-on-surface" data-screen="change_password"><main class="min-h-screen flex items-center justify-center px-margin-mobile py-10"><section class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-xl p-space-lg flex flex-col gap-space-md"><div class="flex flex-col items-center text-center gap-space-sm"><img src="../logo-light.jpeg" data-brand-logo alt="شعار سدد" style="width:96px;height:96px;object-fit:contain;border-radius:20px"><h1 class="font-headline-md text-headline-md text-primary">أنشئ كلمة مرورك الخاصة</h1><p class="text-body-sm text-on-surface-variant">هذه أول مرة تدخل فيها. غيّر كلمة المرور المؤقتة قبل استخدام حساب المتجر.</p></div><form id="changePasswordForm" class="flex flex-col gap-space-sm"><label class="font-label-lg text-label-lg">كلمة المرور الجديدة<input id="newPassword" class="w-full h-12 rounded-xl bg-surface-container-low px-space-md" type="password" minlength="12" autocomplete="new-password" required></label><label class="font-label-lg text-label-lg">تأكيد كلمة المرور<input id="confirmPassword" class="w-full h-12 rounded-xl bg-surface-container-low px-space-md" type="password" minlength="12" autocomplete="new-password" required></label><p id="passwordError" class="text-error font-body-sm" role="alert"></p><button class="w-full h-12 rounded-xl bg-primary-container text-on-primary font-title-lg text-title-lg font-bold">حفظ ومتابعة</button></form><button id="logoutFromPassword" class="h-11 text-on-surface-variant">تسجيل خروج</button></section></main><script src="../app.js"></script></body></html>
