<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>سدد</title>
<style> :root{font-family:Tahoma,Arial,sans-serif;color:#173d34;background:#f1f7f4}*{box-sizing:border-box}body{margin:0;padding:18px 16px 40px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:6px 0}h2{font-size:20px}button,input,select,textarea{font:inherit;border-radius:10px;padding:12px;border:1px solid #bed1c7}button{background:#17694f;color:white;border:0;cursor:pointer}button.secondary{background:#e3ede7;color:#184e3c}button.danger{background:#9e3d37}input,select,textarea{width:100%;background:white;margin:7px 0 14px;color:#173d34}label{display:block;font-size:14px}section,.card{background:white;border-radius:16px;padding:17px;margin:14px 0;box-shadow:0 2px 12px #173d3408}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#577168;font-size:13px;line-height:1.7}.pending{color:#946900;background:#fff4d6;border-radius:6px;padding:3px 6px;font-size:12px}.alert{padding:13px;background:#fff0df;border-radius:10px;line-height:1.6;font-size:14px}#message{display:none;background:#173d34;color:white;padding:12px;border-radius:10px;position:sticky;top:0;z-index:4}.amount{font-size:25px;font-weight:bold;margin:9px 0}.toolbar{display:flex;gap:8px;overflow:auto;margin:18px 0}.toolbar button{white-space:nowrap}.small{font-size:12px;padding:9px}.item{border-bottom:1px solid #e5eee8;padding:14px 0}.item:last-child{border:0}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}dialog{border:0;border-radius:18px;width:94%;max-width:500px;max-height:90%;overflow:auto;color:#173d34}dialog::backdrop{background:#173d3466}.tag{font-size:12px;background:#eef4f0;padding:3px 7px;border-radius:6px}</style>
<header><div><h1>سدد</h1><div class="muted">دفتر المتجر · سجل محفوظ ومزامنة واضحة</div></div><button id="logout" class="secondary small hidden" onclick="act(()=>Ledger.logout());refreshView()">خروج</button></header><div id="message" role="status"></div>
<section id="login" class="hidden"><h2>دخول المتجر</h2><label>رقم المتجر<input id="username" autocomplete="username" inputmode="numeric"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label><button onclick="act(()=>Ledger.login(value('username'),value('password')));document.getElementById('password').value='';refreshView()">دخول</button></section>
<section id="passwordChange" class="hidden"><h2>تغيير كلمة المرور المؤقتة</h2><label>كلمة المرور الحالية<input id="currentPassword" type="password"></label><label>كلمة المرور الجديدة · ١٢ حرفًا على الأقل<input id="newPassword" type="password"></label><button onclick="act(()=>Ledger.changePassword(value('currentPassword'),value('newPassword')));document.getElementById('currentPassword').value='';document.getElementById('newPassword').value='';refreshView()">حفظ ومتابعة</button></section>
<main id="main" class="hidden"><div id="status" class="alert"></div><div class="row"><section><div>للمتجر</div><div id="receivable" class="amount"></div><div id="confirmedReceivable" class="muted"></div></section><section><div>على المتجر</div><div id="payable" class="amount"></div><div id="confirmedPayable" class="muted"></div></section></div><div class="toolbar"><button onclick="Ledger.syncNow();message('بدأ طلب المزامنة. الإدخالات محفوظة حتى وصول النتيجة.')">مزامنة الآن</button><button onclick="formContact()">إضافة شخص</button><button class="secondary" onclick="tab='contacts';render()">الأشخاص</button><button class="secondary" onclick="tab='journal';render()">الإدخالات والحالة</button><button class="secondary" onclick="tab='recovery';render()">الاسترداد والتقارير</button></div><section id="content"></section></main><dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="row"><button id="save">حفظ</button><button class="secondary" onclick="document.getElementById('dialog').close()">إغلاق</button></div></dialog>
<script>
let state={},data={},tab='contacts',contactId='';
const $=id=>document.getElementById(id),value=id=>$(id).value;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>(BigInt(c||0)/100n).toString()+'.'+(BigInt(c||0)%100n).toString().padStart(2,'0')+' ₪';
function cents(v){v=v.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));if(!/^\d+(\.\d{1,2})?$/.test(v))throw Error('أدخل مبلغًا صحيحًا بحد أقصى منزلتين عشريتين.');const p=v.split('.'),c=BigInt(p[0])*100n+BigInt((p[1]||'').padEnd(2,'0'));if(c<=0n||c>9007199254740991n)throw Error('المبلغ خارج النطاق.');return Number(c)}
function message(s){$('message').textContent=s;$('message').style.display='block';setTimeout(()=>$('message').style.display='none',10000)}
function act(fn){try{const r=JSON.parse(fn());if(!r.ok)throw Error(r.message||'تعذر إتمام الإجراء.');if(r.result?.status==='rejected')throw Error('رفض الخادم الإدخال: '+r.result.code);return r}catch(e){message(e.message);return null}}
function refreshView(){const r=act(()=>Ledger.snapshot());if(!r)return;state=r;$('login').classList.toggle('hidden',r.signedIn);$('passwordChange').classList.toggle('hidden',!r.forcePasswordChange);$('main').classList.toggle('hidden',!r.signedIn||r.forcePasswordChange);$('logout').classList.toggle('hidden',!r.signedIn);if(r.data){data=r.data;render()}}
function render(){if(!data.contacts)return;$('receivable').textContent=money(data.receivableCents);$('payable').textContent=money(data.payableCents);$('confirmedReceivable').textContent='المؤكد: '+money(data.confirmedReceivableCents);$('confirmedPayable').textContent='المؤكد: '+money(data.confirmedPayableCents);const pending=data.entries.filter(e=>!['confirmed','cancelled','rejected','reviewed'].includes(e.state));$('status').textContent=(data.sync.error||'البيانات المؤكدة من Supabase.')+' · '+pending.length+' إدخال معلق · '+(data.canAdd?'الإضافة دون اتصال متاحة ضمن ترخيص الأيام السبعة.':'الإضافة تحتاج تحققًا عبر الإنترنت. البيانات القديمة والطابور محفوظان.')+(data.installation.status==='pending'?' · الجهاز ينتظر اعتماد الإدارة.':'');if(tab==='contacts')renderContacts();if(tab==='journal')renderJournal();if(tab==='recovery')renderRecovery();if(tab==='contact')renderContact();}
function renderContacts(){$('content').innerHTML='<h2>الأشخاص</h2>'+data.contacts.map(c=>`<div class="item"><button class="secondary" onclick="contactId='${c.id}';tab='contact';render()">${escape(c.name)}</button> ${c.archived?'<span class="tag">مؤرشف</span>':''} ${c.pending?'<span class="pending">بانتظار المزامنة</span>':''}<div class="muted">${escape(c.phone||c.external_reference||c.externalReference||'بدون هاتف')}</div></div>`).join('');}
function renderContact(){const c=data.contacts.find(c=>c.id===contactId);if(!c){tab='contacts';renderContacts();return;}const debts=data.debts.filter(d=>d.contact_id===contactId);$('content').innerHTML=`<h2>${escape(c.name)}</h2><div class="row">${!c.archived?`<button onclick="formDebt('${c.id}')">إضافة دين</button>`:''}${!c.pending?`<button class="secondary" onclick="archive('${c.id}',${c.version},${!!c.archived})">${c.archived?'استعادة الشخص':'أرشفة الشخص'}</button>`:''}</div>`+debts.map(d=>`<div class="card"><div>${d.direction==='payable'?'على المتجر':'للمتجر'} ${d.pending||d.hasPending?'<span class="pending">يشمل إدخالات معلقة</span>':''}</div><div class="amount">${money(d.remainingCents)}</div><div class="muted">أصل المبلغ ${money(d.currentAmountCents)} · المتبقي المؤكد ${money(d.confirmedRemainingCents)}<br>${escape(d.note||'')} ${d.due_date?'· الاستحقاق '+escape(d.due_date):''}</div><div class="row">${!c.archived&&d.remainingCents>0?`<button class="small" onclick="formPayment('${d.id}')">دفعة</button>`:''}${!d.pending?`<button class="small secondary" onclick="correctDebt('${d.id}',${d.version})">تصحيح عبر الإنترنت</button>`:''}</div>${data.payments.filter(p=>p.debt_id===d.id).map(p=>`<div class="item">دفعة ${money(p.amount_cents)} ${p.reversed?'<span class="tag">معكوسة مع حفظ الأصل</span>':p.pending?'<span class="pending">بانتظار المزامنة</span>':`<button class="small secondary" onclick="reversePayment('${p.id}')">عكس عبر الإنترنت</button>`}</div>`).join('')}</div>`).join('');}
const types={'contact.create':'إضافة شخص','debt.create':'إضافة دين','payment.create':'تسجيل دفعة','debt.correct':'تصحيح دين','payment.reverse':'عكس دفعة','contact.archive':'أرشفة شخص','contact.restore':'استعادة شخص'};
const labels={queued:'محفوظ ولم يبدأ إرساله',sending:'بدأ الإرسال',uncertain:'النتيجة غير مؤكدة',acknowledged:'وصل الإيصال؛ ننتظر البيانات المؤكدة',confirmed:'مؤكد',blocked:'متوقف مع حفظ الإدخال',rejected:'مرفوض — يحتاج مراجعة',cancelled:'ملغى قبل الإرسال',reviewed:'تمت المراجعة'};
function renderJournal(){$('content').innerHTML='<h2>سجل الإدخالات</h2><p class="muted">المهلة أو انقطاع الشبكة لا يعني الرفض. إلغاء الإدخال متاح فقط قبل احتمال إرساله.</p>'+data.entries.map(e=>`<div class="item"><strong>${escape(labels[e.state]||e.state)}</strong><div class="muted">${escape(types[e.command.type]||e.command.type)} · المحاولات ${e.attempts}<br>رقم العملية ${escape(e.command.operationId)}<br>${escape(e.error||'')}${e.projectionExcluded?'<br>استُبعد أثره من الرصيد بسبب اعتماد غير صالح.':''}</div><details><summary>التفاصيل والتاريخ</summary><pre>${escape(JSON.stringify({command:e.command,history:e.history,receipt:e.receipt},null,2))}</pre></details>${e.state==='rejected'&&['contact.create','debt.create','payment.create'].includes(e.command.type)?`<button class="small secondary" onclick="resubmit('${e.command.operationId}')">مراجعة وتقديم إدخال جديد</button>`:''}${e.state==='queued'&&!e.sentEver?`<button class="small danger" onclick="act(()=>Ledger.cancel('${e.command.operationId}'));refreshView()">إلغاء مع حفظ التاريخ</button>`:''}</div>`).join('');}
function renderRecovery(){$('content').innerHTML=`<h2>حماية الإدخالات والاسترداد</h2><p class="alert">الإدخالات غير المزامنة لا تنجو من فقدان الهاتف دون نسخة حديثة خارج الجهاز. فقدان عبارة المرور يمنع فك الملف.</p><label>عبارة مرور ملف الاسترداد<input id="recoveryPass" type="password" autocomplete="off"></label><div class="row"><button onclick="act(()=>Ledger.exportRecovery(value('recoveryPass')));$('recoveryPass').value=''">تصدير مشفر</button><button class="secondary" onclick="act(()=>Ledger.importRecovery(value('recoveryPass')));$('recoveryPass').value=''">استيراد مشفر</button></div><p class="muted">${data.lastExportAt?'آخر تصدير: '+escape(new Date(data.lastExportAt).toLocaleString('ar'))+'. ' : 'لم تُسجّل نسخة استرداد خارجية حتى الآن. '}التذكير: أنشئ نسخة خارج الهاتف بعد إدخالات مهمة وقبل تغيير الجهاز. نقل الجهاز يحتاج اعتماد الإدارة قبل الاستعادة.</p>${data.sync.recoveryRequired?'<p class="alert">تغير إصدار استرداد الخادم. راجع الإدارة قبل الإرسال؛ لم يُحذف الطابور.</p><button onclick="act(()=>Ledger.reconcileEpoch());refreshView()">قراءة الإصدار الحالي مع حفظ الإدخالات القديمة للمصالحة</button>':''}<label>رقم تصريح الاسترداد من الإدارة<input id="permit"></label><button onclick="act(()=>Ledger.setRecoveryPermit(value('permit')));refreshView()">مصالحة باستخدام التصريح</button><details><summary>قائمة الأوامر لطلب موافقة الاسترداد</summary><pre id="recoveryCommands"></pre><button class="secondary" onclick="const r=act(()=>Ledger.recoveryCommands());if(r)$('recoveryCommands').textContent=JSON.stringify(r,null,2)">عرض القائمة</button></details><h2>تقرير الأرصدة</h2><button class="secondary" onclick="act(()=>Ledger.exportReport())">حفظ تقرير نصي مع حالة المزامنة</button><p>للمتجر: ${money(data.receivableCents)} — المؤكد ${money(data.confirmedReceivableCents)}<br>على المتجر: ${money(data.payableCents)} — المؤكد ${money(data.confirmedPayableCents)}</p><p class="muted">الأرصدة الرئيسية تشمل الإضافات المعلقة الموضحة في السجل. إيصال الدفعة المعلقة لا يثبت قبول الخادم.</p>`;}
function dialog(title,fields,onSave){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=fields;$('save').onclick=()=>{try{if(onSave()){$('dialog').close();refreshView()}}catch(e){message(e.message)}};$('dialog').showModal()}
const input=(id,label,type='text')=>`<label>${escape(label)}<input id="${id}" type="${type}"></label>`;
function resubmit(id){const e=data.entries.find(e=>e.command.operationId===id);dialog('مراجعة الرفض — يحفظ الأصل ويولد رقمًا جديدًا','<label>الحقول بعد التصحيح<textarea id="revised" rows="8"></textarea></label>',()=>act(()=>Ledger.resubmit(id,JSON.stringify(JSON.parse(value('revised'))))));$('revised').value=JSON.stringify(e.command.payload,null,2)}
function formContact(){dialog('إضافة شخص',input('name','الاسم')+input('phone','الهاتف بصيغة دولية + أو اتركه فارغًا')+input('note','ملاحظة'),()=>act(()=>Ledger.add('contact.create',JSON.stringify({name:value('name'),phone:value('phone'),note:value('note')}))))}
function formDebt(id){dialog('إضافة دين',input('amount','المبلغ بالشيكل')+'<label>الاتجاه<select id="direction"><option value="receivable">للمتجر</option><option value="payable">على المتجر</option></select></label>'+input('due','تاريخ الاستحقاق','date')+input('note','ملاحظة'),()=>act(()=>Ledger.add('debt.create',JSON.stringify({contactId:id,amountCents:cents(value('amount')),direction:value('direction'),dueDate:value('due'),note:value('note')}))))}
function formPayment(id){dialog('تسجيل دفعة',input('amount','المبلغ بالشيكل')+'<label>الطريقة<select id="method"><option value="cash">نقدي</option><option value="bank">بنك</option><option value="wallet">محفظة</option></select></label>'+input('note','ملاحظة'),()=>act(()=>Ledger.add('payment.create',JSON.stringify({debtId:id,amountCents:cents(value('amount')),method:value('method'),note:value('note')}))))}
function correctDebt(id,version){dialog('تصحيح أصل الدين — عبر الإنترنت',input('amount','أصل المبلغ الصحيح بالشيكل')+input('reason','السبب الإلزامي'),()=>act(()=>Ledger.online('debt.correct',JSON.stringify({debtId:id,amountCents:cents(value('amount')),reason:value('reason')}),version)))}
function reversePayment(id){dialog('عكس دفعة مؤكدة — عبر الإنترنت',input('reason','السبب الإلزامي'),()=>act(()=>Ledger.online('payment.reverse',JSON.stringify({paymentId:id,reason:value('reason')}),0)))}
function archive(id,version,archived){dialog(archived?'استعادة الشخص':'أرشفة مع حفظ الديون والتاريخ',input('reason','السبب الإلزامي'),()=>act(()=>Ledger.online(archived?'contact.restore':'contact.archive',JSON.stringify({contactId:id,reason:value('reason')}),version)))}
refreshView();setInterval(refreshView,10000);
</script></html>
