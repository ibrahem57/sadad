name: Ticket scope

# A ticket PR ("Closes #N") may change only the paths its issue lists under "Files you may edit".
# The checker is tools/ticket_files.py from the base branch, so a PR cannot loosen its own check.
# A branch named ticket-* must close an issue; other PRs (no "Closes #N") pass.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Changed files must be in the ticket's "Files you may edit"
        run: |
          issue=$(gh pr view "$PR" --json body --jq .body | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | head -1 | grep -o '[0-9]\+$' || true)
          if [[ -z $issue ]]; then
            [[ $HEAD_REF != ticket-* ]] || { echo "::error::branch $HEAD_REF has no \"Closes #N\" in the PR body"; exit 1; }
            echo "no ticket issue; nothing to check"; exit 0
          fi
          gh issue view "$issue" --json body --jq .body > "$RUNNER_TEMP/ticket.md"
          grep -q '^Files you may edit' "$RUNNER_TEMP/ticket.md" || { echo "::error::#$issue has no \"Files you may edit:\" list"; exit 1; }
          if out=$(gh pr diff "$PR" --name-only | python3 tools/ticket_files.py scope "$RUNNER_TEMP/ticket.md"); then
            echo "every changed file is allowed by #$issue"
          else
            echo "::error::files outside #$issue \"Files you may edit\":"; echo "$out"; exit 1
          fi
