<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../app.css"><title>قفل سدد</title></head><body class="bg-surface font-body-md text-on-surface" data-screen="unlock"><main class="min-h-screen flex items-center justify-center px-margin-mobile py-10"><section class="w-full max-w-sm bg-surface-container-lowest rounded-2xl shadow-xl p-space-lg flex flex-col gap-space-md text-center"><img src="../logo-light.jpeg" data-brand-logo alt="شعار سدد" style="width:100px;height:100px;object-fit:contain;border-radius:22px;margin:auto"><h1 class="font-headline-md text-headline-md text-primary">التطبيق مقفل</h1><p id="unlockHint" class="text-body-sm text-on-surface-variant">أدخل رمز القفل لفتح سجلاتك.</p><form id="unlockForm" class="flex flex-col gap-space-sm"><input id="appPin" inputmode="numeric" autocomplete="current-password" type="password" maxlength="12" class="h-14 rounded-xl bg-surface-container-low text-center text-headline-md tracking-[0.4em]" placeholder="••••" required><p id="unlockError" class="text-error font-body-sm" role="alert"></p><button class="h-12 rounded-xl bg-primary-container text-on-primary font-title-lg text-title-lg font-bold">فتح التطبيق</button></form><button id="useBiometric" class="h-11 rounded-xl bg-secondary-container text-on-secondary-container font-title-md text-title-md">استخدام البصمة أو الوجه</button><button id="logoutFromLock" class="h-10 text-on-surface-variant font-label-lg text-label-lg">تسجيل خروج</button></section></main><script src="../app.js"></script></body></html>
